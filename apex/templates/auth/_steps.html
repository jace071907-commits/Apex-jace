<ol class="stepper" aria-label="Account setup progress">
  <li class="{{ 'done' if step > 1 else 'current' if step == 1 }}"><span>1</span>Password</li>
  <li class="{{ 'done' if step > 2 else 'current' if step == 2 }}"><span>2</span>Email</li>
  <li class="{{ 'done current' if step == 3 }}"><span>3</span>Ready</li>
</ol>
